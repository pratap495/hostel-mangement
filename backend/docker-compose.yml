version: "3.8"

services:
  # Central PostgreSQL database hosting central admin DB & dynamic tenant databases
  postgres-db:
    image: postgres:15-alpine
    container_name: hostelmint-postgres
    restart: always
    environment:
      POSTGRES_USER: central_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: hostelmint_admin_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hostelmint-net

  # Redis for auth failed-attempts tracking and Celery message broker
  redis-broker:
    image: redis:7-alpine
    container_name: hostelmint-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - hostelmint-net

  # Local S3-compatible file storage (MinIO)
  minio-storage:
    image: minio/minio:latest
    container_name: hostelmint-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - hostelmint-net

  # API Gateway Nginx container
  nginx-gateway:
    image: nginx:alpine
    container_name: hostelmint-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - hostel-service
    networks:
      - hostelmint-net

  # Auth and Tenant Microservice
  auth-service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: hostelmint-auth-service
    restart: always
    environment:
      - APP_ENV=production
      - CENTRAL_DATABASE_URL=postgresql://central_admin:password123@postgres-db:5432/hostelmint_admin_db
      - REDIS_URL=redis://redis-broker:6379/0
      - SECRET_KEY=37a1f592f87a329e92b8d0c2e391a38fc292b23a9d81d2f7823ab293e8cc1cf2
    depends_on:
      - postgres-db
      - redis-broker
    networks:
      - hostelmint-net

  # Hostel & Room Microservice
  hostel-service:
    build:
      context: ./hostel_service
      dockerfile: Dockerfile
    container_name: hostelmint-hostel-service
    restart: always
    environment:
      - APP_ENV=production
      - CENTRAL_DATABASE_URL=postgresql://central_admin:password123@postgres-db:5432/hostelmint_admin_db
      - REDIS_URL=redis://redis-broker:6379/0
      - SECRET_KEY=37a1f592f87a329e92b8d0c2e391a38fc292b23a9d81d2f7823ab293e8cc1cf2
      - S3_ENDPOINT_URL=http://minio-storage:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadminpassword
      - S3_BUCKET_NAME=hostelmint-secure-vault
    depends_on:
      - postgres-db
      - redis-broker
      - minio-storage
    networks:
      - hostelmint-net

volumes:
  postgres_data:
  minio_data:

networks:
  hostelmint-net:
    driver: bridge
