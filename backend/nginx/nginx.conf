events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gateway Reverse Proxy Configuration
    server {
        listen       80;
        server_name  localhost;

        # Use Docker internal DNS with a 5-second TTL
        resolver 127.0.0.11 valid=5s;

        # Inject Security Headers globally
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https://fastapi.tiangolo.com; frame-ancestors 'none';" always;

        # Custom JSON Error Handlers for Nginx Gateway Errors
        error_page 500 502 503 504 = @json_error;
        error_page 404 = @json_404;

        location @json_error {
            default_type application/json;
            add_header Content-Type application/json;
            return 502 '{"detail": "HostelMint API service is temporarily unavailable. Please verify the service containers are running."}';
        }

        location @json_404 {
            default_type application/json;
            add_header Content-Type application/json;
            return 404 '{"detail": "The requested API resource path or service endpoint was not found on the HostelMint gateway."}';
        }

        # 1. Route Auth and Tenants Service endpoints
        location /api/v1/auth {
            set $auth_backend "http://auth-service:8000";
            proxy_pass $auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/tenants {
            set $auth_backend "http://auth-service:8000";
            proxy_pass $auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Route Hostel & Room Service endpoints
        location /api/v1/rooms {
            set $hostel_backend "http://hostel-service:8000";
            proxy_pass $hostel_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/hostelers {
            set $hostel_backend "http://hostel-service:8000";
            proxy_pass $hostel_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Route Finance Service endpoints
        location /api/v1/finance {
            set $finance_backend "http://finance-service:8000";
            proxy_pass $finance_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Route Storage Service endpoints
        location /api/v1/storage {
            set $storage_backend "http://storage-service:8000";
            proxy_pass $storage_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Route Notification REST endpoints
        location /api/v1/notifications {
            set $notification_backend "http://notification-service:8000";
            proxy_pass $notification_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 6. Route WebSocket notifications (Upgrade connection)
        location /api/v1/notifications/ws {
            set $notification_backend "http://notification-service:8000";
            proxy_pass $notification_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # 7. Route S3/MinIO Bucket through Gateway for unified local/tunnel access
        location /hostelmint-secure-vault {
            set $minio_backend "http://minio-storage:9000";
            proxy_pass $minio_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50M;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
        }
    }
}
